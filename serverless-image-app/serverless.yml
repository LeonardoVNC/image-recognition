# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: upbcertiaws
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: serverless-image-app-lab
# "service" is the name of this project. This will also be added to your AWS resource names.
service: serverless-image-final-lab

provider:
  name: aws
  runtime: nodejs20.x
  region: ${file(config.json):AWS_REGION}
  environment: 
    BUCKET_NAME:  ${file(config.json):S3_IMAGE_BUCKET}
    TABLE_NAME: ${file(config.json):DYNAMODB_TABLE_NAME}

  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - s3:*
        - rekognition:DetectLabels
      Resource:
        - arn:aws:s3:::${file(config.json):S3_IMAGE_BUCKET}
        - arn:aws:s3:::${file(config.json):S3_IMAGE_BUCKET}/*
    - Effect: "Allow"
      Action:
        - rekognition:DetectLabels
      Resource: "*"
    - Effect: "Allow"
      Action:
        - dynamodb:PutItem
      Resource: "*"
package:
  exclude:
    - config.json
    - package.json
    - package-lock.json
    - README.md
    - .gitignore
    - .serverless/** 
    - node_modules/**
    - nodejs/**
    - layer_content.zip
functions:
  leoGetSignedUrl:
    handler: src/handler.getSignedUrl
    layers: 
      - {Ref: LeoDependenciesLambdaLayer}
    events:
      - httpApi:
          path: /signed-url
          method: get

  leoProcessImage:
    handler: src/recognize.processImage
    layers: 
      - {Ref: LeoDependenciesLambdaLayer}
    events:
      - s3:
          bucket: ${self:provider.environment.BUCKET_NAME}
          event: s3:ObjectCreated:Put
          existing: true
layers:
  leoDependencies:
    name: 'leo-serverless-dependencies'
    compatibleRuntimes:
      - "nodejs20.x"
    package:
      artifact: layer_content.zip
resources:
  Resources:
    UploadBucket:
      Type: AWS::S3::Bucket
      Properties: 
        BucketName: ${self:provider.environment.BUCKET_NAME}
        CorsConfiguration:
          CorsRules:
            - AllowedMethods:
                - PUT
                - POST
                - GET 
                - DELETE
              AllowedOrigins:
                - "*"
              AllowedHeaders:
                - "*"
              MaxAge: 3000
    ImageTagsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NAME}
        AttributeDefinitions:
          - AttributeName: image
            AttributeType: S
        KeySchema:
          - AttributeName: image
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
